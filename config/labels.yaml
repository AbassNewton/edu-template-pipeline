    negatives: Число отрицательных значений
    ok: OK
    review: Проверить
  text:
    title: Обследование в области образования - многолетний шаблон
    line1: Вводите данные только в белые ячейки. Серые ячейки рассчитываются автоматически.
    line2: Оставьте ячейку пустой, если данные отсутствуют; не вводите ноль вместо отсутствующих данных.
    line3: Перед отправкой проверьте лист «Проверки». Каждый флаг «Проверить» нужно исправить или пояснить в листе «Метаданные».
    version: Версия шаблона
    language: Язык
