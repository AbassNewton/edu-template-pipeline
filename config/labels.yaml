    ENRA: Контингент по возрасту
    POP: Население
    TCH: Учителя
    GOV_TOTAL: Общие государственные расходы
    GOV_EDU: Государственные расходы на образование
    GDP: Валовой внутренний продукт
    GER: Валовой коэффициент охвата (%)
