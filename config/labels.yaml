# User-facing labels, one entry per language. Every key must exist in every
# language (enforced by tests/test_labels.py). Codes in column A of the
# workbook are never translated, so all language versions parse identically.
# Demo translations: in production they would be reviewed by UIS translators.

en:
  sheet:
    instructions: Instructions
    parameters: Parameters
    enrolment: Enrolment
    enrolment_age: Enrolment by age
    population: Population
    teachers: Teachers
    expenditure: Expenditure
    indicators: Indicators
    checks: Checks
    metadata: Metadata
  header: {code: Code, series: Series, dimension: Breakdown, value: Value, source: Source, note: Note, status: Status}
  sex: {F: Female, M: Male, T: Total}
  level: {L1: Primary, L2: Lower secondary, L3: Upper secondary}
  series:
    ENR: Enrolment
    ENRA: Enrolment by age
    POP: Population
    TCH: Teachers
    GOV_TOTAL: Total government expenditure
    GOV_EDU: Government expenditure on education
    GDP: Gross domestic product
    GER: Gross enrolment ratio (%)
    GPI: Gender parity index of the GER
    PTR: Pupil-teacher ratio
    XGOV: Education expenditure as % of total government expenditure
    XGDP: Education expenditure as % of GDP
  param:
    country_code: Country code (ISO 3166 alpha-3)
    country_name: Country name
    currency: National currency
    respondent: Respondent
    entry_age: Official entry age
    duration: Duration (years)
  check:
    total_vs_sum: Total minus (female + male)
    age_vs_total: Sum by age minus total enrolment
    negatives: Number of negative values
    ok: OK
    review: Review
  text:
    title: Education survey - multi-year template
    line1: Enter data in the white cells only. Grey cells are calculated.
    line2: Leave a cell empty when data are not available; do not enter zero for missing data.
    line3: Check the 'Checks' sheet before submitting. Any 'Review' flag should be corrected or explained in 'Metadata'.
    version: Template version
    language: Language

