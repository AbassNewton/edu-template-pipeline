[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edutpl"
version = "0.1.0"
description = "Build, validate and consolidate multi-year education data templates (Excel) - demo on synthetic data"
authors = [{name = "Abass Ndiaye"}]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1", "pandas>=2.0", "numpy", "pyyaml", "matplotlib"]

[project.optional-dependencies]
app = ["streamlit>=1.30"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
